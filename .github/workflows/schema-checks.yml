name: SQLite schema checks
on:
  push:
    paths:
      - 'db/**'
      - 'internal/database/migrations/**'
      - '.github/workflows/schema-checks.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'internal/database/migrations/**'
      - '.github/workflows/schema-checks.yml'
permissions:
  contents: read
jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify SQLite migration constraints
        run: python3 -m unittest discover -s db -p 'test_*.py' -v
