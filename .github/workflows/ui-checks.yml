name: UI checks
on:
  push:
    paths:
      - 'cmd/tongd/ui/**'
      - 'web/src/**'
      - 'web/test/**'
      - '.github/workflows/ui-checks.yml'
  pull_request:
    paths:
      - 'cmd/tongd/ui/**'
      - 'web/src/**'
      - 'web/test/**'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: TypeScript check
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --project web/tsconfig.json --noEmit
      - name: UI behavior tests
        run: node --test web/test/*.test.mjs
