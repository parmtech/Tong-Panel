name: UI checks
on:
  push:
    paths:
      - 'cmd/tongd/ui/**'
      - 'web/src/**'
      - 'web/test/**'
      - '.github/workflows/ui-checks.yml'
  pull_request:
    paths:
      - 'cmd/tongd/ui/**'
      - 'web/src/**'
      - 'web/test/**'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: TypeScript check
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --project web/tsconfig.json --noEmit
      - name: UI behavior tests
        run: node --test web/test/*.test.mjs
