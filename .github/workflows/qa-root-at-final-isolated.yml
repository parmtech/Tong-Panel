name: Isolated root-at final Linux QA
on:
  push:
    branches: ['codex/qa-root-at-final-20261116']
permissions:
  contents: read
jobs:
  root-at-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run restrictive-umask subprocess regression explicitly
        run: |
          test "$(id -u)" -ne 0
          go test -race -count=1 ./cmd/tongbackup -run '^TestRestoreSiteLabRestrictiveUmaskSubprocessRetainsEvidence$'
      - name: Run affected Linux race suites
        run: go test -race -count=1 ./cmd/tongbackup ./internal/files
      - name: Run restore and inventory CLI process suites
        run: |
          test "$(id -u)" -ne 0
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/tongbackup" ./cmd/tongbackup
          python3 scripts/test_backup_restore_site_lab_cli.py "$RUNNER_TEMP/tongbackup"
          python3 scripts/test_backup_inspect_restore_lab_cli.py "$RUNNER_TEMP/tongbackup"